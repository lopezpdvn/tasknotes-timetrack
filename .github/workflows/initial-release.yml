name: Publish initial 0.1.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/initial-release.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 861dcf0a65c38cb9de538ca7e22a156a4947dbea
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: node scripts/validate-release.mjs 0.1.0
      - name: Publish checked first release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create 0.1.0 .release/main.js .release/manifest.json --target 861dcf0a65c38cb9de538ca7e22a156a4947dbea --title 0.1.0 --generate-notes
